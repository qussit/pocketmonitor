<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#181825" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icon-192.png" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<title>Второй монитор</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden;
               touch-action:none; user-select:none; -webkit-user-select:none; }
  #mjpg, #mp4 { position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
                background:#000; display:none; }
  #msg { position:absolute; left:0; top:0; width:100%; height:100%; display:flex;
         align-items:center; justify-content:center; text-align:center; padding:20px;
         box-sizing:border-box; color:#fff; font:600 15px/1.4 system-ui; pointer-events:none;
         text-shadow:0 0 5px #000; }
  #dot { position:absolute; width:10px; height:10px; border-radius:50%;
         background:rgba(255,255,255,.5); pointer-events:none; display:none; }
</style>
</head>
<body>
<img id="mjpg" alt="" />
<video id="mp4" autoplay muted playsinline></video>
<div id="msg">подключение…</div>
<div id="dot"></div>
<script>
const mjpg = document.getElementById("mjpg");
const mp4  = document.getElementById("mp4");
const msg  = document.getElementById("msg");
const dot  = document.getElementById("dot");

let active = null;

// --- полноэкранный режим (скрывает адресную строку) ---
let fsDone = false;
function goFullscreen() {
  if (fsDone) return;
  fsDone = true;
  msg.innerText = "";
  const el = document.documentElement;
  const p = el.requestFullscreen ? el.requestFullscreen() : null;
  if (p && p.catch) p.catch(() => {});
}
document.addEventListener("touchstart", goFullscreen, { once: true, passive: true });

// --- WebSocket для касаний ---
let ws;
function wsConnect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onclose = () => setTimeout(wsConnect, 1500);
  ws.onerror = () => ws.close();
}
wsConnect();
function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

// --- геометрия активного элемента с учётом letterbox ---
function naturalSize(el) {
  if (!el) return [0, 0];
  if (el.tagName === "VIDEO") return [el.videoWidth, el.videoHeight];
  return [el.naturalWidth, el.naturalHeight];
}
function contentRect() {
  if (!active) return { left:0, top:0, width:1, height:1 };
  const r = active.getBoundingClientRect();
  const vw = naturalSize(active)[0], vh = naturalSize(active)[1];
  if (!vw || !vh) return { left: r.left, top: r.top, width: r.width, height: r.height };
  const box = r.width / r.height, vid = vw / vh;
  if (box > vid) {
    const cw = r.height * vid;
    return { left: r.left + (r.width - cw)/2, top: r.top, width: cw, height: r.height };
  }
  const ch = r.width / vid;
  return { left: r.left, top: r.top + (r.height - ch)/2, width: r.width, height: ch };
}
function norm(t) {
  const c = contentRect();
  return { nx: (t.clientX - c.left) / c.width, ny: (t.clientY - c.top) / c.height };
}

// --- жесты ---
const touches = new Map();
let twoStart = null, lastCentroid = null;
function centroid() {
  let x = 0, y = 0, n = 0;
  for (const t of touches.values()) { x += t.clientX; y += t.clientY; n++; }
  return { x: x/n, y: y/n };
}
document.addEventListener("touchstart", (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) touches.set(t.identifier, t);
  if (touches.size === 1) {
    const p = norm([...touches.values()][0]);
    send({ t: "d", x: p.nx, y: p.ny });
  } else if (touches.size === 2) {
    const c = centroid();
    twoStart = { time: Date.now(), cx: c.x, cy: c.y, moved: 0 };
    lastCentroid = c;
  }
}, { passive: false });

document.addEventListener("touchmove", (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) touches.set(t.identifier, t);
  if (touches.size === 1) {
    const p = norm([...touches.values()][0]);
    send({ t: "m", x: p.nx, y: p.ny });
  } else if (touches.size === 2) {
    const c = centroid();
    if (lastCentroid) {
      const dx = c.x - lastCentroid.x, dy = c.y - lastCentroid.y;
      if (twoStart) twoStart.moved += Math.abs(dx) + Math.abs(dy);
      send({ t: "s", dx, dy: -dy });
    }
    lastCentroid = c;
  }
}, { passive: false });

document.addEventListener("touchend", (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) touches.delete(t.identifier);
  if (touches.size === 0) {
    if (twoStart && (Date.now() - twoStart.time) < 350 && twoStart.moved < 40) {
      const c = contentRect();
      const nx = (twoStart.cx - c.left) / c.width, ny = (twoStart.cy - c.top) / c.height;
      send({ t: "r", x: nx, y: ny });
    } else {
      send({ t: "u" });
    }
    twoStart = null; lastCentroid = null;
  } else if (touches.size === 1) {
    const p = norm([...touches.values()][0]);
    twoStart = null; lastCentroid = null;
    send({ t: "d", x: p.nx, y: p.ny });
  }
}, { passive: false });

// индикатор касания
document.addEventListener("pointerdown", (e) => {
  dot.style.display = "block";
  dot.style.left = (e.clientX - 5) + "px";
  dot.style.top = (e.clientY - 5) + "px";
});
document.addEventListener("pointermove", (e) => {
  if (e.buttons) { dot.style.left = (e.clientX - 5) + "px"; dot.style.top = (e.clientY - 5) + "px"; }
});
window.addEventListener("pointerup", () => dot.style.display = "none");

// --- MJPEG (latency-режим) ---
function setupMJPEG() {
  active = mjpg;
  mjpg.style.display = "block";
  mjpg.onload = () => { if (fsDone) msg.innerText = ""; };
  mjpg.src = "/video";
}

// --- H.264 via MSE (gaming-режим) ---
function setupMSE(codecHint) {
  active = mp4;
  mp4.style.display = "block";
  const candidates = [codecHint, "avc1.42E033", "avc1.42E01F", "avc1.640033"].filter(Boolean);
  const codec = candidates.find(c => MediaSource.isTypeSupported('video/mp4; codecs="' + c + '"'));
  if (!codec) { msg.innerText = "видео: кодек не поддерживается"; return; }

  const ms = new MediaSource();
  mp4.src = URL.createObjectURL(ms);
  ms.addEventListener("sourceopen", () => {
    const sb = ms.addSourceBuffer('video/mp4; codecs="' + codec + '"');
    sb.mode = "segments";
    fetch("/video").then(async (resp) => {
      const reader = resp.body.getReader();
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        await new Promise((res) => {
          sb.addEventListener("updateend", () => res(), { once: true });
          try { sb.appendBuffer(value); } catch (e) { res(); }
        });
      }
    }).catch(() => msg.innerText = "видео: соединение потеряно");
  });
  mp4.play().catch(() => {});
  const iv = setInterval(() => {
    if (mp4.videoWidth > 0) { msg.innerText = ""; clearInterval(iv); }
  }, 500);
}

// --- init ---
(async () => {
  try {
    const m = await (await fetch("/mode")).json();
    if (m.mode === "latency") setupMJPEG();
    else setupMSE(m.codec);
  } catch (e) {
    msg.innerText = "нет соединения с сервером";
  }
})();

// сервис-воркер
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(() => {});
}
</script>
</body>
</html>
